# Included in every location block on the HTTPS server — nginx's add_header directive
# is NOT inherited by a location that already declares its own add_header (e.g. the
# Cache-Control ones below), so this is included explicitly everywhere rather than
# relied upon from the server level.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
# style-src needs 'unsafe-inline' for React's inline style props (waveform bars) and
# fonts.googleapis.com's stylesheet; media-src is scheme-only (not a domain allowlist)
# because Deezer/iTunes preview URLs come from rotating CDN subdomains.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
